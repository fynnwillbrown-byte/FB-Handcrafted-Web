<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Handcrafted</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="navbar">
        <div class="navbar__brand">
            <div class="logo">
                <img src="img/fbhandcrafted logo.png" width="50px" height="50px" alt="FB Handcrafted Logo">
            </div>
            <div class="h1"><h1>FB Handcrafted</h1></div>
        </div>
        
        <!-- Toggle button visible only on mobile -->
        <button class="navbar__toggle" id="mobile-menu-btn" aria-label="Toggle navigation">☰</button>
        
        <ul class="navbar__menu" id="navbar-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About Me</a></li>
        </ul>
    </div> 

    <!-- MAIN HERO CONTAINER -->
    <div class="hero-section">
        <!-- LEFT SIDE: Text content -->
        <div class="Par">
            <h1 class="text_par">Buy Beautiful<br>Handmade<br>Goods</h1>
            <p>FB Handcrafted Handmade In Canada</p>
            <a href="products.html" class="hero__btn">Explore Now &#x279C;</a>
        </div>
        
        <!-- RIGHT SIDE: Image container -->
        <div class="backdrop__img">
            <img src="img/Striped Walnut and Maple Cutting Board (1).png" alt="Handmade Cutting Board">
        </div>
    </div>

    <div id="products-section">
        <!-- Future home page content -->
    </div>

    
    <!-- Script to run the mobile menu drawer -->
    <script>
        const menuBtn = document.getElementById('mobile-menu-btn');
        const navbarMenu = document.getElementById('navbar-menu');

        menuBtn.addEventListener('click', () => {
            navbarMenu.classList.toggle('active');
        });
    </script>

    <!-- Secure Private Counter Block (Hidden by default) -->
    <div id="private-admin-node" style="display: none; background: #141310; color: #e4a853; text-align: center; padding: 15px; font-family: monospace; font-size: 1.1rem; border-top: 1px solid #2d2a24;">
        Admin Views: <span style="font-weight: bold; background: #000; padding: 2px 8px; border-radius: 4px; margin-left: 5px;" id="admin-view-digits">...</span>
    </div>

    <!-- Background logger that only shows the results if you unlock it in your browser -->
    <script>
        fetch('https://counterapi.dev')
            .then(res => res.json())
            .then(data => {
                if (data && data.value) {
                    // This checks if your browser has the secret access key activated
                    if (localStorage.getItem('show_my_private_counter') === 'true') {
                        document.getElementById('private-admin-node').style.display = 'block';
                        document.getElementById('admin-view-digits').innerText = data.value;
                    }
                }
            })
            .catch(err => console.log('Syncing...'));
    </script>
   
</body>
</html>
