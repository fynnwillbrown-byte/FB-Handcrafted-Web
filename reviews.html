<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews - FB Handcrafted</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Modern Layout Overrides */
        .reviews-layout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 5%;
        }

        .reviews-intro-header {
            max-width: 1200px;
            margin: 40px auto 10px;
            padding: 0 5%;
        }

        /* Clean Input Box Styling */
        #review-form {
            background-color: #ffffff;
            border: 1px solid #eaeaea;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            position: sticky;
            top: 40px;
        }

        #review-form label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c2c2c;
            font-size: 0.95rem;
        }

        #review-form input[type="text"],
        #review-form select,
        #review-form textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1rem;
            color: #333;
            background-color: #fafafa;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        #review-form input[type="text"]:focus,
        #review-form select:focus,
        #review-form textarea:focus {
            outline: none;
            border-color: #e4a853;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(228, 168, 83, 0.15);
        }

        #review-form button[type="submit"] {
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        /* Clean Feed Output */
        .reviews-feed h3 {
            font-size: 1.6rem;
            color: #2c2c2c;
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* Mobile Adjustments */
        @media (max-width: 900px) {
            .reviews-layout-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }
            #review-form {
                position: static;
            }
        }
    </style>
</head>
<body>
    
    <!-- NAVIGATION BAR -->
    <div class="navbar">
        <div class="navbar__brand">
            <div class="logo">
                <img src="img/fbhandcrafted logo.png" width="50px" height="50px" alt="FB Handcrafted Logo">
            </div>
            <div class="h1"><h1>FB Handcrafted</h1></div>
        </div>
        
        <button class="navbar__toggle" id="mobile-menu-btn" aria-label="Toggle navigation">☰</button>
        
        <ul class="navbar__menu" id="navbar-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About Me</a></li>
            <li><a href="reviews.html">Reviews</a></li>
        </ul>
    </div>

    <!-- MAIN PAGE HEADER -->
    <div class="reviews-intro-header">
        <h2 class="products__title" style="border: none; margin-bottom: 0;">Customer Feedback</h2>
        <p style="color: #777; font-size: 1.1rem; margin-top: 5px;">See what others are saying about FB Handcrafted custom pieces.</p>
    </div>

    <!-- TWO-COLUMN WORKSPACE GRID -->
    <div class="reviews-layout-grid">
        
        <!-- LEFT COLUMN: Submit Card -->
        <div>
            <form id="review-form">
                <h3 style="margin-bottom: 20px; color: #2c2c2c; font-size: 1.3rem;">Share Your Experience</h3>
                
                <div>
                    <label for="reviewer-name">Your Name</label>
                    <input type="text" id="reviewer-name" required placeholder="Enter your name">
                </div>
                
                <div>
                    <label for="reviewer-rating">Select Rating</label>
                    <select id="reviewer-rating" required>
                        <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                        <option value="4">⭐⭐⭐⭐ (4/5)</option>
                        <option value="3">⭐⭐⭐ (3/5)</option>
                        <option value="2">⭐⭐ (2/5)</option>
                        <option value="1">⭐ (1/5)</option>
                    </select>
                </div>

                <div>
                    <label for="reviewer-comment">Your Review</label>
                    <textarea id="reviewer-comment" rows="6" required placeholder="What do you think of your board's craftsmanship, timber, or grain detail?"></textarea>
                </div>

                <button type="submit" class="hero__btn">Post Public Review &#x279C;</button>
            </form>
        </div>

        <!-- RIGHT COLUMN: Scrolling Feed Stream -->
        <div class="reviews-feed">
            <h3>Recent Submissions</h3>
            <div id="reviews-list">
                <!-- Submissions inject here instantly -->
            </div>
        </div>

    </div>

    <!-- CLEAN STANDARD FOOTER -->
    <footer class="site-footer">
        <p>© 2026 FB Handcrafted. Handmade In Canada.</p>
    </footer>

    <!-- INTERACTIVE CLOUD SCRIPT SYSTEM -->
    <!-- 1. Load the Supabase cloud library securely -->
    <script src="https://jsdelivr.net"></script>

    <script>
        // 2. Initialize your Cloud Database Connection
        const SUPABASE_URL = "https://ezylibvjcscjamlqbzeu.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_dscd5dKMEn6RJUxYdTWtPg_87GT-J4z"; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- MOBILE MENU TOGGLE LOGIC ---
        const menuBtn = document.getElementById('mobile-menu-btn');
        const navbarMenu = document.getElementById('navbar-menu');

        if (menuBtn && navbarMenu) {
            menuBtn.addEventListener('click', () => {
                navbarMenu.classList.toggle('active');
            });
        }

        // --- REVIEWS STORAGE ENGINE ---
        const form = document.getElementById('review-form');
        const displayList = document.getElementById('reviews-list');

        // Automatically fetch data from the cloud when the page loads
        window.addEventListener('load', loadReviews);

        if (form) {
            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const name = document.getElementById('reviewer-name').value;
                const rating = parseInt(document.getElementById('reviewer-rating').value);
                const comment = document.getElementById('reviewer-comment').value;

                // Send review data straight to your Supabase cloud database table
                const { data, error } = await _supabase
                    .from('reviews')
                    .insert([{ name, rating, comment }]);

                if (error) {
                    console.error("Cloud Error saving review:", error);
                    alert("Something went wrong saving your review. Please try again.");
                } else {
                    form.reset();
                    // Reload the feed to display the freshly submitted review
                    loadReviews();
                }
            });
        }

        async function loadReviews() {
            if (!displayList) return;
            displayList.innerHTML = '<p style="color: #888; text-align: center;">Loading community reviews...</p>';
            
            // Pull down all reviews sorted by the newest submission first
            let { data: feed, error } = await _supabase
                .from('reviews')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Cloud Error fetching reviews:", error);
                displayList.innerHTML = '<p style="color: #ff5555; text-align: center;">Could not load reviews right now.</p>';
                return;
            }

            displayList.innerHTML = '';

            if (!feed || feed.length === 0) {
                displayList.innerHTML = '<p style="color: #888; font-style: italic; background: #fff; border: 1px dashed #ddd; padding: 30px; text-align: center; border-radius: 8px;">No reviews left yet. Be the first to add your feedback!</p>';
                return;
            }

            feed.forEach(item => {
                const stars = '⭐'.repeat(item.rating);
                
                // Formats the timestamp from the database into a clean readable date
                const cleanDate = new Date(item.created_at).toLocaleDateString('en-CA', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });

                const card = document.createElement('div');
                card.className = 'review-card-item'; 
                card.style.background = '#ffffff';
                card.style.border = '1px solid #eaeaea';
                card.style.padding = '20px';
                card.style.borderRadius = '8px';
                card.style.marginBottom = '20px';
                card.style.boxShadow = '0 2px 10px rgba(0,0,0,0.01)';
                
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <strong style="color: #2c2c2c; font-size: 1.1rem; font-weight: 700;">${cleanInput(item.name)}</strong>
Use code with caution.
${cleanDate}

${stars}
${cleanInput(item.comment)}
`;
displayList.appendChild(card);
});
}
// Sanitizer utility against malicious text/script injections (XSS Security)
function cleanInput(str) {
if (!str) return '';
return str.replace(/[&<>'"]/g, match => ({
'&': '&', '<': '<', '>': '>', "'": ''', '"': '"'
}[match]));
}
