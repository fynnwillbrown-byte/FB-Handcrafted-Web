<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Handcrafted</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="navbar">
        <div class="navbar__brand">
            <div class="logo">
                <img src="img/fbhandcrafted logo.png" width="50px" height="50px" alt="FB Handcrafted Logo">
            </div>
            <div class="h1"><h1>FB Handcrafted</h1></div>
        </div>
        
        <!-- Toggle button visible only on mobile -->
        <button class="navbar__toggle" id="mobile-menu-btn" aria-label="Toggle navigation">☰</button>
        
        <ul class="navbar__menu" id="navbar-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About Me</a></li>
            <li><a href="reviews.html">Reviews</a></li>
        </ul>
    </div> 

    <!-- MAIN HERO CONTAINER -->
    <div class="hero-section">
        <!-- LEFT SIDE: Text content -->
        <div class="Par">
            <h1 class="text_par">Buy Beautiful<br>Handmade<br>Goods</h1>
            <p>FB Handcrafted Handmade In Canada</p>
            <a href="products.html" class="hero__btn">Explore Now &#x279C;</a>
        </div>
        
        <!-- RIGHT SIDE: Image container -->
        <div class="backdrop__img">
            <img src="img/Striped Walnut and Maple Cutting Board (1).png" alt="Handmade Cutting Board">
        </div>
    </div>

    <div id="products-section">
        <!-- Future home page content -->
    </div>

    <!-- PUBLIC VIEW COUNTER FOOTER -->
    <footer class="site-footer">
        <p>© 2026 FB Handcrafted. Handmade In Canada.</p>
        <div class="counter-display">
            <!-- Hidden by default via inline style -->
            <span id="counter-wrapper" style="display: none;">
                Total Page Views: <span id="view-count">...</span>
            </span>
            <!-- Hidden text box and unlock button -->
            <span id="unlock-container">
                <input type="password" id="secret-key" placeholder="Enter password" style="padding: 2px 5px; font-size: 12px; margin-left: 5px;">
                <button onclick="checkPassword()" style="padding: 2px 8px; font-size: 12px; cursor: pointer;">Unlock Views</button>
            </span>
        </div>
    </footer>

    <!-- Connections to the centralized JavaScript behaviors -->
    <script src="script.js"></script>

</body>
</html>
