<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Handcrafted</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="navbar">
        <div class="navbar__brand">
            <div class="logo">
                <img src="img/fbhandcrafted logo.png" width="50px" height="50px" alt="FB Handcrafted Logo">
            </div>
            <div class="h1"><h1>FB Handcrafted</h1></div>
        </div>
        
        <!-- Toggle button visible only on mobile -->
        <button class="navbar__toggle" id="mobile-menu-btn" aria-label="Toggle navigation">☰</button>
        
        <ul class="navbar__menu" id="navbar-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About Me</a></li>
        </ul>
    </div> 

    <!-- MAIN HERO CONTAINER -->
    <div class="hero-section">
        <!-- LEFT SIDE: Text content -->
        <div class="Par">
            <h1 class="text_par">Buy Beautiful<br>Handmade<br>Goods</h1>
            <p>FB Handcrafted Handmade In Canada</p>
            <a href="products.html" class="hero__btn">Explore Now &#x279C;</a>
        </div>
        
        <!-- RIGHT SIDE: Image container -->
        <div class="backdrop__img">
            <img src="img/Striped Walnut and Maple Cutting Board (1).png" alt="Handmade Cutting Board">
        </div>
    </div>

    <div id="products-section">
        <!-- Future home page content -->
    </div>

    <!-- PUBLIC VIEW COUNTER FOOTER -->
    <footer class="site-footer">
        <p>© 2026 FB Handcrafted. Handmade In Canada.</p>
        <div class="counter-display">
            Total Page Views: <span id="view-count">...</span>
        </div>
    </footer>

    
    <!-- Script to run the mobile menu drawer -->
    <script>
        const menuBtn = document.getElementById('mobile-menu-btn');
        const navbarMenu = document.getElementById('navbar-menu');

        menuBtn.addEventListener('click', () => {
            navbarMenu.classList.toggle('active');
        });
    </script>

    <!-- Global Database Tracker Logic -->
    <script>
        const counterElement = document.getElementById('view-count');
        
        // Check if this specific visitor has already been counted in this session
        if (sessionStorage.getItem('fb_visit_counted')) {
            // If already counted, just fetch the current database total without adding a view
            fetch('https://mileshilliard.com')
                .then(res => res.json())
                .then(data => {
                    if (data && data.value) {
                        counterElement.innerText = data.value;
                    }
                })
                .catch(() => counterElement.innerText = '154'); // Fallback number
        } else {
            // Brand new visitor session! Hit the database to increase the global view count by 1
            fetch('https://mileshilliard.com')
                .then(res => res.json())
                .then(data => {
                    if (data && data.value) {
                        counterElement.innerText = data.value;
                        // Mark this user as counted so navigation doesn't trigger another view
                        sessionStorage.setItem('fb_visit_counted', 'true');
                    }
                })
                .catch(() => counterElement.innerText = '154');
        }
    </script>
   
</body>
</html>
