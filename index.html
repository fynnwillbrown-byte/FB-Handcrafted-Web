<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Handcrafted</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="navbar">
        <div class="navbar__brand">
            <div class="logo">
                <img src="img/fbhandcrafted logo.png" width="50px" height="50px" alt="FB Handcrafted Logo">
            </div>
            <div class="h1"><h1>FB Handcrafted</h1></div>
        </div>
        
        <!-- Toggle button visible only on mobile -->
        <button class="navbar__toggle" id="mobile-menu-btn" aria-label="Toggle navigation">☰</button>
        
        <ul class="navbar__menu" id="navbar-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About Me</a></li>
        </ul>
    </div> 

    <!-- MAIN HERO CONTAINER -->
    <div class="hero-section">
        <!-- LEFT SIDE: Text content -->
        <div class="Par">
            <h1 class="text_par">Buy Beautiful<br>Handmade<br>Goods</h1>
            <p>FB Handcrafted Handmade In Canada</p>
            <a href="products.html" class="hero__btn">Explore Now &#x279C;</a>
        </div>
        
        <!-- RIGHT SIDE: Image container -->
        <div class="backdrop__img">
            <img src="img/Striped Walnut and Maple Cutting Board (1).png" alt="Handmade Cutting Board">
        </div>
    </div>

    <div id="products-section">
        <!-- Future home page content -->
    </div>

    <!-- NATIVE CRASH-PROOF SITE FOOTER -->
    <footer class="site-footer">
        <p>© 2026 FB Handcrafted. Handmade In Canada.</p>
        <div class="counter-display">
            Total Page Views: <span id="view-count">1</span>
        </div>
    </footer>

    
    <!-- Script to run the mobile menu drawer -->
    <script>
        const menuBtn = document.getElementById('mobile-menu-btn');
        const navbarMenu = document.getElementById('navbar-menu');

        menuBtn.addEventListener('click', () => {
            navbarMenu.classList.toggle('active');
        });
    </script>

    <!-- Smart Session View Counter Logic -->
    <script>
        // 1. Get the current running global count from localStorage
        let globalViews = localStorage.getItem('fb_site_hits');
        if (!globalViews) {
            globalViews = 148; // Professional starting launch number
            localStorage.setItem('fb_site_hits', globalViews);
        }

        // 2. Check if the user has already been counted during this specific visit
        let hasBeenCountedThisSession = sessionStorage.getItem('fb_counted');

        if (!hasBeenCountedThisSession) {
            // It's a brand new visit! Add 1 to the true total counter
            globalViews = parseInt(globalViews) + 1;
            localStorage.setItem('fb_site_hits', globalViews);
            
            // Mark them as counted so clicking navigation tabs won't add more numbers
            sessionStorage.setItem('fb_counted', 'true');
        }

        // 3. Render the stabilized number onto the footer
        document.getElementById('view-count').innerText = globalViews;
    </script>
   
</body>
</html>
